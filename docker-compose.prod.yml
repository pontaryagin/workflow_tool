version: '3'
services:

  db:
    image: postgres:14
    ports:
      - '${DB_PORT:?not set}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}

  builder:
    image: builder
    build:
      context: .
      dockerfile: prod.Dockerfile
    env_file:
      - .env.prod
    command: build finish!

  next-app:
    # build:
    #   context: .
    #   dockerfile: prod.Dockerfile

    # env_file:
    #   - .env.prod
    image: builder
    # extends:
    #   service: builder
    restart: always
    tty: true # docker run -t
    ports:
      - ${NEXT_PORT?:Input port for next app}:3000
    environment:
      - PORT=${NEXT_PORT}
    depends_on:
      - db
      - builder
    command: node server.js
  prisma-studio:
    # build:
    #   context: .
    #   dockerfile: prod.Dockerfile
    # env_file:
    #   - .env.prod
    image: builder
    # extends:
    #   service: builder
    restart: always
    tty: true # docker run -t
    ports:
      - ${PRISMA_STUDIO_PORT?:}:${PRISMA_STUDIO_PORT?:}
    environment:
      - PRISMA_STUDIO_PORT=${PRISMA_STUDIO_PORT}
    depends_on:
      - db
      - _build
    command: npx prisma studio --port ${PRISMA_STUDIO_PORT}
volumes:
  db-data:
