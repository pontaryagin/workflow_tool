version: '3'
services:

  db:
    image: postgres:14
    ports:
      - '${DB_PORT:?not set}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}

  next-app:
    build:
      context: .
      dockerfile: prod.Dockerfile

    env_file:
      - .env.prod
    restart: always
    tty: true # docker run -t
    ports:
      - ${NEXT_PORT?:Input port for next app}:3000
    environment:
      - PORT=${NEXT_PORT}
    depends_on:
      - db
volumes:
  db-data:
